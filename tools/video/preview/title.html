<!doctype html>
<!--
  The opening title of a course page's sample-lesson video, and the plain
  navy ground the clips sit on. render-title.js screenshots it; see
  docs/video-editing.md §9. Not part of the theme.
-->
<html lang="fa">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Peyda; font-weight: 700; src: url(../../../assets/fonts/peyda/PeydaWeb-Bold.woff2) format('woff2'); }
@font-face { font-family: Peyda; font-weight: 900; src: url(../../../assets/fonts/peyda/PeydaWeb-Black.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: transparent; direction: ltr; font-family: Peyda, sans-serif; }
body.ground { background: radial-gradient(110% 90% at 50% 0%, #24467a 0%, #1B365D 42%, #0F2140 100%); }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.07); }
.c { position: absolute; left: 0; width: 1280px; display: flex; justify-content: center; }
.eyebrow { background: #fff; color: #1B365D; font-size: 30px; font-weight: 700; padding: 6px 28px 10px; border-radius: 999px; direction: rtl; box-shadow: 0 10px 30px rgba(8,20,42,.4); }
.mask { overflow: hidden; display: inline-block; padding: 0 4px 14px; margin-bottom: -14px; }
.mask > span { display: inline-block; }
.h { color: #fff; font-size: 92px; font-weight: 900; line-height: 1.2; direction: rtl; display: flex; gap: 22px; }
.code { position: relative; color: #fff; font-size: 200px; font-weight: 900; line-height: .9; letter-spacing: -4px; direction: ltr; padding-right: 50px; }
.code .dot { position: absolute; right: 4px; bottom: 18px; width: 38px; height: 38px; border-radius: 50%; background: #C8102E; }
</style>
</head>
<body>
<div id="g"></div>
<script>
'use strict';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, d) => clamp((t - t0) / d);
const out3 = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const inout = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const g = document.getElementById('g');

// The ground: navy, with a few faint guilloché-like rings that never move.
function ground() {
  document.body.className = 'ground';
  [[1180, 80], [1180, 80], [1180, 80], [1180, 80], [100, 700], [100, 700], [100, 700]].forEach(([x, y], i) => {
    const d = 240 + (i % 4) * 190, r = document.createElement('div');
    r.className = 'ring'; Object.assign(r.style, { left: (x - d / 2) + 'px', top: (y - d / 2) + 'px', width: d + 'px', height: d + 'px' });
    document.body.appendChild(r);
  });
}

let eb, words, code, dot, wrap;
function build(eyebrow, heading, level) {
  wrap = document.createElement('div');
  Object.assign(wrap.style, { position: 'absolute', inset: 0, transformOrigin: '640px 360px' });
  g.appendChild(wrap);
  wrap.innerHTML = `<div class="c" style="top:118px"><span class="eyebrow">${eyebrow}</span></div>
    <div class="c" style="top:190px"><div class="h">${heading.split(' ').map(w => `<span class="mask"><span>${w}</span></span>`).join('')}</div></div>
    <div class="c" style="top:350px"><div class="code"><span class="t">${level}</span><i class="dot"></i></div></div>`;
  eb = wrap.querySelector('.eyebrow'); words = [...wrap.querySelectorAll('.mask > span')];
  code = wrap.querySelector('.code .t'); dot = wrap.querySelector('.dot');
}
// TITLE_OUT: when the title starts to leave; it is gone 0.5 s later.
function seek(t, OUT) {
  const e = prog(t, .15, .4);
  eb.style.opacity = Math.min(1, e * 2); eb.style.transform = `scale(${t < .15 ? .8 : .8 + .2 * back(e)})`;
  words.forEach((w, i) => { const p = out3(prog(t, .45 + i * .16, .55)); w.style.transform = `translateY(${(1 - p) * 110}%)`; });
  const c = out3(prog(t, .95, .6));
  code.style.display = 'inline-block'; code.style.opacity = c; code.style.transform = `translateY(${(1 - c) * 50}px)`;
  const d = prog(t, 1.4, .32);
  dot.style.transform = `translateY(${(1 - back(d)) * -110}px) scale(${d > 0 ? back(d) : 0})`;
  const x = inout(prog(t, OUT, .5));
  wrap.style.opacity = 1 - x; wrap.style.transform = `scale(${1 + .05 * x})`;
}
</script>
</body>
</html>
