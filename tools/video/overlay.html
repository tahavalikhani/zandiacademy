<!doctype html>
<!--
  Motion-graphics layer for the course videos. Not part of the theme; never
  served to visitors on purpose. tools/video/render-overlay.js opens this page
  in Playwright's Chromium, calls build(timeline) once and seek(t) per frame,
  and screenshots it with a transparent background. HTML because Persian
  shaping, ZWNJ and Latin/Persian bidi come out right in a browser and nowhere
  else this cheaply. Style rules: docs/video-editing.md §4–§6.
-->
<html lang="fa">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Peyda; font-weight: 200; src: url(../../assets/fonts/peyda/PeydaWeb-ExtraLight.woff2) format('woff2'); }
@font-face { font-family: Peyda; font-weight: 400; src: url(../../assets/fonts/peyda/PeydaWeb-Regular.woff2) format('woff2'); }
@font-face { font-family: Peyda; font-weight: 600; src: url(../../assets/fonts/peyda/PeydaWeb-SemiBold.woff2) format('woff2'); }
@font-face { font-family: Peyda; font-weight: 700; src: url(../../assets/fonts/peyda/PeydaWeb-Bold.woff2) format('woff2'); }
@font-face { font-family: Peyda; font-weight: 900; src: url(../../assets/fonts/peyda/PeydaWeb-Black.woff2) format('woff2'); }

:root { --navy: #1B365D; --navy-deep: #0F2140; --red: #C8102E; --ink: #1B365D; --shadow: 0 6px 18px rgba(15, 33, 64, .22); }
* { box-sizing: border-box; margin: 0; padding: 0; }
/* The document is LTR on purpose: in an RTL document anything positioned past
   the left edge (the rings) becomes scrollable overflow and shifts every
   right-anchored element ~150px off frame. RTL lives on the items instead. */
html { width: 1280px; height: 720px; overflow: hidden; background: transparent; direction: ltr; }
body { position: relative; width: 1280px; height: 720px; overflow: hidden; background: transparent; font-family: Peyda, sans-serif; color: var(--ink); direction: ltr; }
body.under { background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); }

.zone { position: absolute; display: flex; flex-direction: column; gap: 12px; direction: ltr; }
.zone > * { direction: rtl; }
.z-left    { left: 56px; top: 104px; align-items: flex-start; max-width: 430px; }
.z-right   { right: 104px; top: 112px; align-items: flex-end; max-width: 400px; }
.z-name    { right: 150px; top: 418px; align-items: flex-end; gap: 8px; }
.z-split   { right: 650px; top: 0; bottom: 0; justify-content: center; align-items: flex-end; width: 560px; gap: 14px; }
.z-caption { left: 0; right: 0; bottom: 40px; align-items: center; }
.z-end     { left: 56px; top: 116px; align-items: flex-start; gap: 10px; }
.z-left .it, .z-end .it { transform-origin: left center; }
.z-right .it, .z-name .it, .z-split .it { transform-origin: right center; }
.z-caption .it { transform-origin: center bottom; }

.it { will-change: transform, opacity; }
.pill { display: inline-flex; align-items: center; gap: 9px; border-radius: 999px; white-space: nowrap; box-shadow: var(--shadow); }
.pill svg { flex: none; }
.eyebrow { background: #fff; color: var(--ink); font-size: 16px; font-weight: 600; padding: 6px 14px; }
.chip    { background: #fff; color: var(--ink); font-size: 20px; font-weight: 700; padding: 9px 18px; }
.navy    { background: var(--navy); color: #fff; font-size: 21px; font-weight: 700; padding: 10px 20px; }
.check   { background: #fff; color: var(--ink); font-size: 21px; font-weight: 700; padding: 11px 20px; }
.big     { background: var(--navy); color: #fff; font-size: 40px; font-weight: 900; padding: 10px 26px 12px; border-radius: 22px; }
.skills  { background: #fff; color: var(--ink); font-size: 20px; font-weight: 700; padding: 9px 18px; }
.url     { background: #fff; color: var(--ink); font-size: 17px; font-weight: 700; padding: 6px 14px; direction: ltr; }
.caption { display: inline-block; background: #fff; color: var(--ink); font-size: 23px; font-weight: 600; padding: 10px 24px; }
.caption b { font-weight: 900; color: var(--navy); }
.name    { position: relative; background: var(--navy); color: #fff; font-size: 31px; font-weight: 900; padding: 10px 24px 12px; border-radius: 16px; }
.name::before { content: ''; position: absolute; top: -7px; left: -7px; width: 15px; height: 15px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px #fff; }

.heading { color: #fff; font-size: 46px; font-weight: 900; line-height: 1.25; display: flex; align-items: center; gap: 12px; }
.sub     { color: rgba(255,255,255,.72); font-size: 21px; font-weight: 600; margin-top: -4px; }
.sep     { color: rgba(255,255,255,.7); font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; width: 260px; }
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.35); }

.code { position: relative; color: #fff; font-size: 150px; font-weight: 900; line-height: .9; direction: ltr; letter-spacing: -2px; text-shadow: 0 6px 24px rgba(15,33,64,.35); padding-inline-end: 34px; }
.code .dot { position: absolute; right: 0; bottom: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--red); }

.stat { background: var(--navy); color: #fff; font-size: 96px; font-weight: 900; line-height: 1; padding: 10px 30px 18px; border-radius: 24px; box-shadow: var(--shadow); }
.stat span { unicode-bidi: isolate; direction: ltr; display: inline-block; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; max-width: 400px; direction: ltr; }
.tag { background: #fff; color: var(--ink); font-size: 19px; font-weight: 700; padding: 6px 14px 7px; direction: ltr; gap: 7px; }
.tag svg { color: var(--navy); opacity: .55; }

.bubble { position: relative; background: #fff; color: var(--ink); font-size: 30px; font-weight: 900; padding: 14px 26px 16px; border-radius: 24px; box-shadow: var(--shadow); white-space: nowrap; }
.bubble::after { content: ''; position: absolute; bottom: -10px; right: 34px; width: 22px; height: 22px; background: #fff; transform: rotate(45deg); border-radius: 4px; }
.bubble .strike { position: absolute; left: 18px; right: 18px; top: 50%; height: 5px; margin-top: -1px; background: var(--navy); border-radius: 3px; transform-origin: right center; transform: scaleX(0); }

.path { display: flex; align-items: center; direction: rtl; padding: 6px 2px; }
.node { position: relative; width: 70px; height: 70px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; font-size: 24px; font-weight: 900; direction: ltr; box-shadow: var(--shadow); }
.node .tick { position: absolute; top: -4px; right: -4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(15,33,64,.3); transform: scale(0); }
.node .ring { position: absolute; inset: -9px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }
.node .reddot { position: absolute; bottom: 14px; right: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--red); transform: scale(0); }
.link { position: relative; width: 58px; height: 4px; background: rgba(255,255,255,.55); border-radius: 2px; overflow: hidden; }
.link i { position: absolute; inset: 0; background: var(--navy); transform-origin: right center; transform: scaleX(0); }

.logo { background: #fff; border-radius: 24px; padding: 14px 26px 14px 22px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); direction: rtl; }
.logo svg { width: 60px; height: 66px; overflow: visible; }
.logo .z { stroke: var(--navy); fill: none; }
.logo .d { fill: var(--red); }
.logo .t { display: flex; flex-direction: column; align-items: flex-end; }
.logo .n { font-size: 32px; font-weight: 900; color: var(--navy); line-height: 1.15; }
.logo .s { font-size: 12px; font-weight: 600; letter-spacing: .38em; color: var(--navy); opacity: .75; direction: ltr; }

.rings { position: absolute; pointer-events: none; overflow: visible; }
.rings circle { fill: none; stroke: #fff; stroke-width: 1.6; }
body.under .rings circle { stroke-width: 1.2; }
</style>
</head>
<body>
<script>
const ICON = {
  check: '<path d="M5 12.5l4.2 4.2L19 7"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  play: '<circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.8l5 3.2-5 3.2z" fill="currentColor"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  repeat: '<path d="M17 2.5l3 3-3 3"/><path d="M4 11v-1.5a4 4 0 0 1 4-4h12"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 13v1.5a4 4 0 0 1-4 4H4"/>',
  video: '<rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/>',
  chat: '<path d="M4 5.5h16v10H9l-5 4z"/>',
  list: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1" fill="currentColor"/>',
  test: '<rect x="5" y="3.5" width="14" height="17.5" rx="2.5"/><path d="M9 3.5h6v3H9z"/><path d="M8.5 13l2.5 2.5 4.5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/>',
  infinity: '<path d="M12 12c-2-2.8-3.6-4-5.5-4a4 4 0 0 0 0 8c1.9 0 3.5-1.2 5.5-4zm0 0c2 2.8 3.6 4 5.5 4a4 4 0 0 0 0-8c-1.9 0-3.5 1.2-5.5 4z"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/>'
};
const svg = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

const clamp = x => Math.max(0, Math.min(1, x));
const outBack = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const outCubic = p => 1 - Math.pow(1 - p, 3);
const inOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

let ANIM = [];   // {el, at, out, mode, extra}

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

function itemHTML(it) {
  const ic = it.icon ? svg(it.icon, it.kind === 'big' ? 34 : 20, it.kind === 'big' ? 2.4 : 2) : '';
  switch (it.kind) {
    case 'eyebrow': return `<div class="pill eyebrow">${esc(it.text)}</div>`;
    case 'chip':    return `<div class="pill chip">${esc(it.text)}${ic}</div>`;
    case 'navy':    return `<div class="pill navy">${esc(it.text)}${ic}</div>`;
    case 'big':     return `<div class="pill big">${esc(it.text)}${ic}</div>`;
    case 'skills':  return `<div class="pill skills">${esc(it.text)}${svg('grid', 20)}</div>`;
    case 'check':   return `<div class="pill check">${it.icon ? svg(it.icon, 21) : ''}${esc(it.text)}${svg('check', 19, 2.6)}</div>`;
    case 'heading': return `<div class="heading">${esc(it.text)}${it.icon ? `<span style="color:#fff;opacity:.9">${svg(it.icon, 38, 2.2)}</span>` : ''}</div>`;
    case 'sub':     return `<div class="sub">${esc(it.text)}</div>`;
    case 'sep':     return `<div class="sep">${esc(it.text)}</div>`;
    case 'name':    return `<div class="name">${esc(it.text)}</div>`;
    case 'code':    return `<div class="code">${esc(it.text)}<span class="dot"></span></div>`;
    case 'stat':    return `<div class="stat"><span>${esc(it.text)}</span></div>`;
    case 'url':     return `<div class="pill url">${esc(it.text)}</div>`;
    case 'tag':     return `<div class="pill tag" lang="fr">${esc(it.text)}${svg('check', 15, 2.6)}</div>`;
    case 'caption': {
      let t = esc(it.text);
      if (it.bold) t = t.replace(esc(it.bold), `<b>${esc(it.bold)}</b>`);
      return `<div class="pill caption">${t}</div>`;
    }
    case 'bubble':  return `<div class="bubble">${esc(it.text)}<span class="strike"></span></div>`;
    case 'logo':    return `<div class="logo"><svg viewBox="15.5 5 81 90"><circle class="d" cx="68" cy="13" r="8"/><path class="z" d="M22,34 H82 L28,78 C46,93 78,93 90,70" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="t"><span class="n">آکادمی زندی</span><span class="s">FRANÇAIS</span></div></div>`;
    case 'path': {
      const parts = it.nodes.map((n, i) => `${i ? '<div class="link"><i></i></div>' : ''}<div class="node">${esc(n.code)}<span class="tick">${svg('check', 16, 3)}</span><span class="ring"></span>${n.goal ? '<span class="reddot"></span>' : ''}</div>`);
      return `<div class="path">${parts.join('')}</div>`;
    }
  }
  throw new Error('unknown kind ' + it.kind);
}

function build(tl) {
  document.body.innerHTML = '';
  ANIM = [];
  for (const g of tl.groups) {
    const zone = el(`<div class="zone z-${g.zone}"></div>`);
    document.body.appendChild(zone);
    let tags = null;
    for (const it of g.items) {
      const node = el(itemHTML(it));
      node.classList.add('it');
      if (it.kind === 'tag') {
        if (!tags) { tags = el('<div class="tags"></div>'); zone.appendChild(tags); }
        tags.appendChild(node);
      } else { tags = null; zone.appendChild(node); }
      if (it.kind === 'bubble') node.style.transform = 'rotate(-3deg)';
      ANIM.push({ el: node, it, out: g.out, zone: g.zone });
    }
    if (g.rings) {
      const target = zone.querySelector('.code, .stat');
      const r = target.getBoundingClientRect();
      const ring = el(`<svg class="rings" width="600" height="600" viewBox="-300 -300 600 600"><circle r="0"/><circle r="0"/><circle r="0"/></svg>`);
      ring.style.left = (r.left + r.width / 2 - 300) + 'px';
      ring.style.top = (r.top + r.height / 2 - 300) + 'px';
      document.body.insertBefore(ring, document.body.firstChild);
      ANIM.push({ el: ring, it: { kind: 'rings', at: g.items[0].at }, out: g.out, zone: g.zone });
    }
  }
}

function buildUnder() {
  document.body.className = 'under';
  document.body.innerHTML = `<svg class="rings" style="left:-170px;top:-200px" width="640" height="640" viewBox="-320 -320 640 640">
    <circle r="110" style="opacity:.10"/><circle r="175" style="opacity:.08"/><circle r="240" style="opacity:.06"/><circle r="305" style="opacity:.045"/></svg>
    <svg class="rings" style="right:-260px;bottom:-300px" width="640" height="640" viewBox="-320 -320 640 640">
    <circle r="150" style="opacity:.05"/><circle r="230" style="opacity:.035"/></svg>`;
}

function seek(t) {
  const sig = []; let any = false;
  for (const a of ANIM) {
    const { el, it, out } = a;
    const pin = clamp((t - it.at) / 0.32);
    const pout = clamp((t - out) / 0.22);
    let op = 0, sc = 1, ty = 0, tx = 0;
    if (t >= it.at && pout < 1) {
      op = Math.min(1, pin * 1.8) * (1 - pout);
      if (it.kind === 'heading' || it.kind === 'sub') { const e = outCubic(clamp((t - it.at) / 0.45)); tx = (1 - e) * 26; op = Math.min(1, e * 1.4) * (1 - pout); }
      else if (it.kind === 'code') { const e = outCubic(clamp((t - it.at) / 0.5)); ty = (1 - e) * 28; op = Math.min(1, e * 1.5) * (1 - pout); }
      else if (it.kind === 'caption') { const e = outCubic(clamp((t - it.at) / 0.3)); ty = (1 - e) * 14; op = e * (1 - pout); }
      else if (it.kind !== 'rings') { const e = outBack(pin); sc = 0.85 + 0.15 * e; ty = (1 - e) * 8; }
      sc *= 1 - 0.06 * pout;
    }
    el.style.opacity = op.toFixed(3);
    el.style.visibility = op > 0 ? 'visible' : 'hidden';
    const rot = it.kind === 'bubble' ? ' rotate(-3deg)' : '';
    if (it.kind !== 'rings') el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${sc.toFixed(4)})${rot}`;
    sig.push(op.toFixed(3), sc.toFixed(4), ty.toFixed(2), tx.toFixed(2));
    if (op <= 0) continue;
    any = true;

    if (it.kind === 'rings') {
      const cs = el.querySelectorAll('circle');
      cs.forEach((c, i) => {
        const ph = ((t - it.at) / 2.6 + i / 3) % 1;
        c.setAttribute('r', (60 + ph * 230).toFixed(1));
        c.style.opacity = (Math.sin(ph * Math.PI) * 0.55).toFixed(3);
      });
      sig.push(t.toFixed(3));
    }
    if (it.kind === 'code') {
      const d = clamp((t - it.at - 0.38) / 0.3);
      const s = d > 0 ? outBack(d) : 0;
      el.querySelector('.dot').style.transform = `scale(${s.toFixed(3)})`;
      sig.push(s.toFixed(3));
    }
    if (it.kind === 'bubble' && it.strike) {
      const s = inOut(clamp((t - it.strike) / 0.35));
      el.querySelector('.strike').style.transform = `scaleX(${s.toFixed(3)})`;
      sig.push(s.toFixed(3));
    }
    if (it.kind === 'path') {
      const nodes = el.querySelectorAll('.node'), links = el.querySelectorAll('.link i');
      it.nodes.forEach((n, i) => {
        const nd = nodes[i];
        if (n.done !== undefined) {
          const p = clamp((t - n.done) / 0.28);
          nd.style.background = p > 0.5 ? 'var(--navy)' : '#fff';
          nd.style.color = p > 0.5 ? '#fff' : 'var(--navy)';
          nd.querySelector('.tick').style.transform = `scale(${(p > 0 ? outBack(p) : 0).toFixed(3)})`;
          if (i < links.length) links[i].style.transform = `scaleX(${inOut(clamp((t - n.done - 0.15) / 0.45)).toFixed(3)})`;
          sig.push(p.toFixed(3), (t - n.done).toFixed(2) > 0 ? clamp((t - n.done - 0.15) / 0.45).toFixed(3) : 0);
        }
        if (n.goal !== undefined) {
          const p = clamp((t - n.goal) / 0.35);
          nd.style.transform = `scale(${(1 + 0.18 * outBack(p) - 0.0).toFixed(3)})`;
          nd.style.background = p > 0.4 ? 'var(--navy)' : '#fff';
          nd.style.color = p > 0.4 ? '#fff' : 'var(--navy)';
          nd.querySelector('.reddot').style.transform = `scale(${(clamp((t - n.goal - 0.25) / 0.25) > 0 ? outBack(clamp((t - n.goal - 0.25) / 0.25)) : 0).toFixed(3)})`;
          const pulse = t > n.goal ? ((t - n.goal) / 1.4) % 1 : -1;
          const ring = nd.querySelector('.ring');
          ring.style.opacity = pulse >= 0 ? (0.8 * (1 - pulse)).toFixed(3) : 0;
          ring.style.transform = pulse >= 0 ? `scale(${(1 + pulse * 0.6).toFixed(3)})` : 'scale(1)';
          sig.push(t > n.goal ? t.toFixed(3) : 0);
        }
      });
    }
    if (it.kind === 'logo') {
      const z = el.querySelector('.z'), d = el.querySelector('.d');
      const L = 190, p = inOut(clamp((t - it.at - 0.1) / 0.8));
      z.style.strokeDasharray = L; z.style.strokeDashoffset = (L * (1 - p)).toFixed(2);
      const q = clamp((t - it.at - 0.85) / 0.3);
      d.style.transformOrigin = '68px 13px'; d.style.transform = `scale(${(q > 0 ? outBack(q) : 0).toFixed(3)})`;
      sig.push(p.toFixed(3), q.toFixed(3));
    }
  }
  return (any ? '1|' : '0|') + sig.join(',');
}
</script>
</body>
</html>
